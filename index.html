<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milton's Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root { --bg: #f4f6f9; --surface: #ffffff; --fg: #18202c; --muted: #586374; --line: #d3d9e2; --accent: #2453c0; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #11151c; --surface: #19202a; --fg: #e5e9f0; --muted: #9ba6b6; --line: #2d3644; --accent: #82a6ff; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; line-height: 1.6; padding-inline: 16px; padding-block: 56px 72px; }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
h1 { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 2.2rem; line-height: 1.2; margin: 0; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a.card { display: grid; gap: 4px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; }
a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
.name { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 700; color: var(--accent); }
.desc { color: var(--muted); font-size: 0.97rem; }
.date { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Milton's Pages</h1>
  <ul>
    <li>
      <a class="card" href="lumocad-qc-hand-in/">
        <span class="date">2026-10-07</span>
        <span class="name">LumoCad QC Hand-In</span>
        <span class="desc">How the QC hand-in works across LumoCad, the Lumoview server and LumoPlan, updated with Rio's feedback: the corrections check status, approving to the next planned stage, and the four emails.</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
